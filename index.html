<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-[#f9f9f9] text-zinc-900 min-h-screen pb-20">

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-6 left-6 z-50 transform translate-y-20 opacity-0 transition-all duration-200 bg-zinc-900 text-white font-medium px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 text-sm">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">Prompt copiado com sucesso!</span>
  </div>

  <!-- HEADER -->
  <header class="border-b border-zinc-200 bg-white sticky top-0 z-40 px-6 py-2.5">
    <div class="max-w-[1700px] mx-auto flex items-center justify-between gap-4">
      
      <!-- LOGO -->
      <div class="flex items-center gap-2 cursor-pointer select-none" onclick="location.reload()">
        <div class="w-9 h-6 bg-red-600 rounded-md flex items-center justify-center text-white shadow-sm">
          <i class="fa-solid fa-play text-xs ml-0.5"></i>
        </div>
        <span class="font-bold tracking-tight text-lg text-zinc-900">Prompt<span class="text-zinc-500 font-normal ml-1">Vault</span></span>
      </div>

      <!-- BUSCA -->
      <div class="flex-1 max-w-2xl flex items-center justify-center">
        <div class="w-full flex items-center border border-zinc-300 rounded-full overflow-hidden focus-within:border-blue-600 transition shadow-inner bg-white">
          <input type="text" id="searchInput" placeholder="Buscar qualquer palavra no prompt (Junji, Bengus, Nanquim...)" 
                 class="w-full text-zinc-900 text-sm px-5 py-2 focus:outline-none bg-transparent">
          <button class="bg-zinc-100 hover:bg-zinc-200 border-l border-zinc-300 px-6 py-2 text-zinc-600 transition">
            <i class="fa-solid fa-search text-xs"></i>
          </button>
        </div>
      </div>

      <!-- AÇÕES: CRIAR & CONFIG -->
      <div class="flex items-center gap-2">
        <button onclick="openUploadModal()" class="flex items-center gap-2 bg-zinc-100 hover:bg-zinc-200 border border-zinc-300 text-zinc-800 text-xs font-bold px-4 py-2 rounded-full transition shadow-sm active:scale-95">
          <i class="fa-solid fa-plus text-red-600"></i>
          <span>Criar</span>
        </button>
        <button onclick="openConfigModal()" title="Configurar Token GitHub" class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 transition">
          <i class="fa-solid fa-gear text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- FEED -->
  <main class="max-w-[1700px] mx-auto px-6 py-8">
    <div id="feedGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-6 gap-y-8"></div>
  </main>

  <!-- MODAL DE UPLOAD DIRETO -->
  <div id="uploadModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl border border-zinc-200 flex flex-col max-h-[90vh]">
      <div class="px-6 py-4 border-b border-zinc-100 flex items-center justify-between">
        <h3 class="font-bold text-base text-zinc-900 flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-red-600"></i>
          Publicar Nova Arte no Vault
        </h3>
        <button onclick="closeUploadModal()" class="text-zinc-400 hover:text-zinc-700 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="p-6 overflow-y-auto space-y-4">
        <!-- ZONA DA IMAGEM -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Imagem (Clique, Arraste ou dê Ctrl+V)</label>
          <div id="dropZone" onclick="document.getElementById('fileInput').click()" class="relative border-2 border-dashed border-zinc-300 hover:border-zinc-500 rounded-xl p-4 flex flex-col items-center justify-center min-h-[180px] bg-zinc-50 cursor-pointer transition overflow-hidden">
            <img id="imagePreview" class="max-h-48 rounded-lg object-contain hidden" src="" alt="Preview">
            <div id="dropPrompt" class="text-center">
              <i class="fa-regular fa-image text-3xl text-zinc-400 mb-2"></i>
              <p class="text-xs font-semibold text-zinc-700">Selecione ou Cole a Imagem aqui</p>
              <p class="text-[11px] text-zinc-400 mt-1">PNG, JPG, JPEG ou WEBP</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
          </div>
        </div>

        <!-- CAMPO DO PROMPT -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Texto Completo do Prompt</label>
          <textarea id="promptInput" rows="7" placeholder="Cole aqui o prompt que gerou a imagem..." 
                    class="w-full text-xs font-mono bg-zinc-50 border border-zinc-200 rounded-xl p-3 focus:outline-none focus:border-zinc-800 text-zinc-800"></textarea>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-zinc-100 bg-zinc-50 flex items-center justify-between">
        <button onclick="closeUploadModal()" class="text-xs font-medium text-zinc-600 hover:text-zinc-900 px-3 py-2">Cancelar</button>
        <button id="btnPublish" onclick="publishNewArt()" class="bg-zinc-900 hover:bg-zinc-800 text-white font-bold text-xs px-5 py-2.5 rounded-full flex items-center gap-2 shadow transition active:scale-95">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Publicar no Vault</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CONFIGURAÇÃO DO TOKEN -->
  <div id="configModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl border border-zinc-200 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-base text-zinc-900 flex items-center gap-2">
          <i class="fa-solid fa-key text-amber-500"></i>
          Configurar GitHub
        </h3>
        <button onclick="closeConfigModal()" class="text-zinc-400 hover:text-zinc-700 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <p class="text-xs text-zinc-500 leading-relaxed">
        Cole seu token do GitHub uma única vez para autorizar publicações direto pelo site. Ele fica salvo apenas no seu navegador.
      </p>

      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Repositório</label>
        <input type="text" id="cfgRepo" value="liamharrisom/prompt-vault" class="w-full text-xs bg-zinc-50 border border-zinc-300 rounded-lg p-2.5 text-zinc-800">
      </div>

      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Personal Access Token (ghp_...)</label>
        <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full text-xs bg-zinc-50 border border-zinc-300 rounded-lg p-2.5 text-zinc-800">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="saveConfig()" class="bg-zinc-900 hover:bg-zinc-800 text-white font-bold text-xs px-4 py-2 rounded-lg transition">Salvar Chave</button>
      </div>
    </div>
  </div>

  <script>
    let promptsData = [];
    let selectedImageFile = null;
    let selectedImageBase64 = null;
    let selectedImageExt = 'jpeg';

    async function loadPrompts() {
      try {
        const response = await fetch('./prompts.json?t=' + Date.now());
        promptsData = await response.json();
        render(promptsData);
      } catch (err) {
        document.getElementById('feedGrid').innerHTML = `<div class="col-span-full py-12 text-center text-zinc-400 text-sm">Nenhum prompt encontrado.</div>`;
      }
    }

    function render(items) {
      const grid = document.getElementById('feedGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-zinc-400 text-sm">Nenhuma arte encontrada.</div>`;
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "flex flex-col bg-white rounded-2xl p-3 border border-zinc-200 shadow-sm hover:shadow-md transition-shadow";

        card.innerHTML = `
          <a href="${item.image}" target="_blank" rel="noopener noreferrer" class="relative block w-full aspect-video bg-zinc-100 rounded-xl overflow-hidden border border-zinc-200/80 group">
            <img src="${item.image}" alt="Arte" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.02]">
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/15 transition flex items-center justify-center">
              <span class="opacity-0 group-hover:opacity-100 transition bg-zinc-900/85 text-white text-xs font-medium px-3 py-1.5 rounded-lg backdrop-blur shadow-lg">
                <i class="fa-solid fa-arrow-up-right-from-square text-[11px] mr-1.5"></i> Abrir Imagem Original
              </span>
            </div>
          </a>

          <div class="mt-3 px-1">
            <button onclick="copyPrompt(${index})" class="w-full bg-zinc-900 hover:bg-zinc-800 active:scale-[0.98] text-white font-medium text-xs py-2.5 rounded-xl flex items-center justify-center gap-2 transition shadow-sm">
              <i class="fa-regular fa-copy"></i>
              <span>Copiar Prompt</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function copyPrompt(index) {
      const text = promptsData[index].prompt;
      navigator.clipboard.writeText(text).then(() => {
        showToast("Prompt copiado com sucesso!");
      });
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      document.getElementById('toastMsg').innerText = msg;
      
      icon.className = isError ? "fa-solid fa-circle-xmark text-rose-400" : "fa-solid fa-circle-check text-emerald-400";
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // BUSCA
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = promptsData.filter(item => item.prompt.toLowerCase().includes(q));
      render(filtered);
    });

    // CONTROLE DE MODAL UPLOAD
    function openUploadModal() {
      const token = localStorage.getItem('pv_token');
      if (!token) {
        openConfigModal();
        showToast("Configure seu token do GitHub primeiro!", true);
        return;
      }
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
      clearUploadForm();
    }

    function clearUploadForm() {
      selectedImageFile = null;
      selectedImageBase64 = null;
      document.getElementById('promptInput').value = '';
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('imagePreview').src = '';
      document.getElementById('dropPrompt').classList.remove('hidden');
    }

    // ARQUIVOS: SELEÇÃO E DRAG & DROP
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) processFile(file);
    }

    function processFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Por favor, selecione um arquivo de imagem.');
        return;
      }
      selectedImageFile = file;
      selectedImageExt = file.name.split('.').pop().toLowerCase() || 'jpeg';
      if (selectedImageExt === 'jpg') selectedImageExt = 'jpeg';

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedImageBase64 = e.target.result.split(',')[1];
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('imagePreview').classList.remove('hidden');
        document.getElementById('dropPrompt').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    // SUPORTE A CTRL+V DE IMAGEM
    window.addEventListener('paste', (e) => {
      if (document.getElementById('uploadModal').classList.contains('hidden')) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          const file = item.getAsFile();
          processFile(file);
          showToast("Imagem colada da área de transferência!");
          break;
        }
      }
    });

    // DRAG AND DROP
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('border-zinc-800'); });
    });
    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('border-zinc-800'); });
    });
    dropZone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) processFile(file);
    });

    // CONFIGURAÇÃO TOKEN
    function openConfigModal() {
      document.getElementById('cfgRepo').value = localStorage.getItem('pv_repo') || 'liamharrisom/prompt-vault';
      document.getElementById('cfgToken').value = localStorage.getItem('pv_token') || '';
      document.getElementById('configModal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    function saveConfig() {
      const repo = document.getElementById('cfgRepo').value.trim();
      const token = document.getElementById('cfgToken').value.trim();
      if (!token) { alert('Digite o token!'); return; }
      localStorage.setItem('pv_repo', repo);
      localStorage.setItem('pv_token', token);
      closeConfigModal();
      showToast("Configuração salva com sucesso!");
    }

    // ENVIAR DIRETO PRO GITHUB VIA API
    async function publishNewArt() {
      const token = localStorage.getItem('pv_token');
      const repo = localStorage.getItem('pv_repo') || 'liamharrisom/prompt-vault';
      const prompt = document.getElementById('promptInput').value.trim();

      if (!token) { openConfigModal(); return; }
      if (!selectedImageBase64) { alert('Selecione ou cole uma imagem primeiro!'); return; }
      if (!prompt) { alert('Digite ou cole o texto do prompt!'); return; }

      const btn = document.getElementById('btnPublish');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>Publicando...</span>`;

      try {
        // 1. Descobrir o próximo ID numérico
        let nextId = 1;
        promptsData.forEach(p => {
          const num = parseInt(p.id, 10);
          if (!isNaN(num) && num >= nextId) nextId = num + 1;
        });

        const imgFileName = `${nextId}.${selectedImageExt}`;
        const imgPath = `images/${imgFileName}`;

        // 2. Subir imagem para GitHub
        const imgUploadRes = await fetch(`https://api.github.com/repos/${repo}/contents/${imgPath}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: `Upload arte #${nextId} via Web`,
            content: selectedImageBase64
          })
        });

        if (!imgUploadRes.ok) {
          const err = await imgUploadRes.json();
          throw new Error('Falha no upload da imagem: ' + (err.message || imgUploadRes.statusText));
        }

        // 3. Pegar o SHA atual de prompts.json
        const jsonGetRes = await fetch(`https://api.github.com/repos/${repo}/contents/prompts.json`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json'
          }
        });
        const jsonGetData = await jsonGetRes.json();
        const jsonSha = jsonGetData.sha;

        // 4. Montar a lista atualizada
        const newItem = {
          id: String(nextId),
          image: imgPath,
          prompt: prompt
        };
        promptsData.push(newItem);

        // Encode UTF-8 to Base64
        const updatedJsonStr = JSON.stringify(promptsData, null, 2);
        const jsonBase64 = btoa(unescape(encodeURIComponent(updatedJsonStr)));

        // 5. Salvar prompts.json no GitHub
        const jsonPutRes = await fetch(`https://api.github.com/repos/${repo}/contents/prompts.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: `Adiciona prompt #${nextId} via Web`,
            content: jsonBase64,
            sha: jsonSha
          })
        });

        if (!jsonPutRes.ok) {
          const err = await jsonPutRes.json();
          throw new Error('Falha ao atualizar prompts.json: ' + (err.message || jsonPutRes.statusText));
        }

        // Sucesso! Atualiza visual na hora
        render(promptsData);
        closeUploadModal();
        showToast(`Arte #${nextId} publicada com sucesso!`);

      } catch (err) {
        console.error(err);
        alert('Erro ao publicar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i><span>Publicar no Vault</span>`;
      }
    }

    loadPrompts();
  </script>
</body>
</html>
